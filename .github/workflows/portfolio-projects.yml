name: NLP and SQL checks
on:
  push:
    paths: ['projects/messagelab/**', 'projects/librarylens/**', '.github/workflows/portfolio-projects.yml']
  pull_request:
    paths: ['projects/messagelab/**', 'projects/librarylens/**', '.github/workflows/portfolio-projects.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  message-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/messagelab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/messagelab/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python download_data.py
      - run: python train.py
      - run: python -m pytest -q
  library-lens:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: projects/librarylens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python report.py
      - run: python -m unittest discover -s tests -v
